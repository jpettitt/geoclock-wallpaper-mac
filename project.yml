# XcodeGen project definition for GeoClockWallpaper. Run
# `xcodegen generate` to regenerate the .xcodeproj from this file.
# The generated project is gitignored — this YAML is the source of
# truth for everything Xcode would otherwise keep in opaque XML.

name: GeoClockWallpaper
options:
  bundleIdPrefix: world.geoclock
  deploymentTarget:
    macOS: '13.0'  # WKWebView snapshot APIs we use are 13+ stable
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # SwiftUI lifecycle + concurrency
    SWIFT_VERSION: '5.10'
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    # Code signing — set automatically for local dev; for release
    # builds you'll set DEVELOPMENT_TEAM via xcconfig or in Xcode.
    CODE_SIGN_STYLE: Automatic
    # No Mac Catalyst, this is macOS-native.
    SUPPORTS_MACCATALYST: NO
    # SwiftUI previews work in 14+ but we set the bar at 13.
    ENABLE_PREVIEWS: YES
    # One version for every target (app, saver) — release.sh ships
    # them together and mismatched versions would be a lie.
    MARKETING_VERSION: '0.1.1-alpha'
    CURRENT_PROJECT_VERSION: '2'

targets:
  GeoClockWallpaper:
    type: application
    platform: macOS
    sources:
      - path: GeoClockWallpaper
        excludes:
          - Info.plist  # referenced via INFOPLIST_FILE, not as a source
      - path: WebAssets
        # Folder reference — XcodeGen ships the whole directory
        # verbatim as Contents/Resources/WebAssets/. The
        # BundledAssetHandler maps geoclock-app:// URLs to files
        # in here. Synced from the card repo by
        # scripts/sync-web-assets.sh; never edited by hand.
        type: folder
        buildPhase: resources
    info:
      path: GeoClockWallpaper/Info.plist
      # XcodeGen merges these into the Info.plist on top of the file
      # contents. Keeping them here means the values that matter for
      # SwiftUI / menu-bar behavior live next to the rest of the
      # project config, not in opaque plist XML.
      properties:
        LSUIElement: true   # menu-bar only, no Dock icon
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: 'GPL-3.0-or-later © 2026 John Pettitt'
        # User-visible explanation Apple shows in the location-
        # access prompt. We only ask when the user picks
        # "My location" in Settings.
        NSLocationUsageDescription: >-
          Used to center the live wallpaper map on your current
          location. If you decline, the map falls back to your
          time zone's centroid instead.
        # No transit declaration since the only network use is
        # loading https://geoclock.world (TLS, public).
    entitlements:
      path: GeoClockWallpaper/GeoClockWallpaper.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Core Location access — needed in addition to the
        # Info.plist usage description on sandboxed Mac apps.
        # The user still has to grant permission in the prompt.
        com.apple.security.personal-information.location: true
        # Outbound network only — we hit geoclock.world / R2.
        com.apple.security.network.client: true
        # Read-write into ~/Library/Application Support/<bundle>
        # is granted by default in the sandbox; no entitlement
        # needed. setDesktopImageURL works inside the sandbox.
        # Reading the user's bookmark of the Pictures folder would
        # need an entitlement, but we never touch it.
        # Saver frame export: the screensaver runs in Apple's
        # legacyScreenSaver host, which can read the whole
        # filesystem except TCC-protected paths — but NOT our
        # sandbox container (containers are TCC-protected). So we
        # publish frames to /Users/Shared, which needs this
        # exception. Fine for Developer ID distribution;
        # temporary-exceptions only matter for App Store review.
        com.apple.security.temporary-exception.files.absolute-path.read-write:
          - /Users/Shared/GeoClockWallpaper/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: world.geoclock.wallpaper
        PRODUCT_NAME: GeoClockWallpaper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO  # we supply our own

  # GeoClock screensaver — a thin .saver bundle that composites the
  # app's published frames (/Users/Shared/GeoClockWallpaper) with the
  # SAME SwiftUI overlay the app draws on the desktop. The shared
  # sources are compiled into both targets rather than split into a
  # framework: a framework inside a .saver complicates signing and
  # the legacyScreenSaver host's library validation for zero gain at
  # this size.
  GeoClockSaver:
    type: bundle
    platform: macOS
    sources:
      - path: GeoClockSaver
        excludes:
          - Info.plist
      # thumbnail.png / thumbnail@2x.png — the System Settings
      # saver-selector grid tile. Without them macOS shows a
      # generic placeholder. Generated from a real rendered frame.
      # Listed individually so they land at Contents/Resources/
      # root (a folder reference would nest them one level down,
      # where the selector never looks).
      - path: GeoClockSaver/Resources/thumbnail.png
        buildPhase: resources
      - path: GeoClockSaver/Resources/thumbnail@2x.png
        buildPhase: resources
      - path: GeoClockWallpaper/OverlayView.swift
      - path: GeoClockWallpaper/OverlayState.swift
      - path: GeoClockWallpaper/Projection.swift
      - path: GeoClockWallpaper/Sun.swift
      - path: GeoClockWallpaper/WallpaperConfig.swift
      - path: GeoClockWallpaper/PerDisplaySettings.swift
      - path: GeoClockWallpaper/DisplayIdentity.swift
      - path: GeoClockWallpaper/TimezoneResolver.swift
      - path: GeoClockWallpaper/TimezoneCentroid.swift
      - path: GeoClockWallpaper/Diagnostics.swift
      - path: GeoClockWallpaper/SaverShared.swift
      - path: GeoClockWallpaper/ColorHex.swift
    dependencies:
      - sdk: ScreenSaver.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: world.geoclock.saver
        PRODUCT_NAME: GeoClockSaver
        WRAPPER_EXTENSION: saver
        # Keep thumbnail.png/@2x as literal PNGs — the saver
        # selector doesn't read the combined HiDPI .tiff Xcode
        # would otherwise produce.
        COMBINE_HIDPI_IMAGES: NO
        INFOPLIST_FILE: GeoClockSaver/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  # XCTest target for the pure-logic parts of the app —
  # projection math, sun astronomical formulas, the
  # WallpaperConfig Codable migrations and per-display
  # `resolved(forDisplay:)` override folding. We don't (yet)
  # test the AppKit/Combine/WKWebView surfaces; those need
  # ui-test infrastructure that's a bigger lift.
  GeoClockWallpaperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GeoClockWallpaperTests
    dependencies:
      - target: GeoClockWallpaper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: world.geoclock.wallpaper.tests
        PRODUCT_NAME: GeoClockWallpaperTests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GeoClockWallpaper.app/Contents/MacOS/GeoClockWallpaper
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GeoClockSaver:
    build:
      targets:
        GeoClockSaver: all
    run:
      config: Debug
    archive:
      config: Release

  GeoClockWallpaper:
    build:
      targets:
        GeoClockWallpaper: all
        GeoClockWallpaperTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GeoClockWallpaperTests
    archive:
      config: Release
